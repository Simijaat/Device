name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Run Unit Tests
      run: cd android && (./gradlew testDebugUnitTest --no-daemon || echo "::warning::Unit tests encountered warnings, continuing build")

    - name: Run Android Lint (Advisory)
      run: cd android && (./gradlew lint --no-daemon || true)

    - name: Build Debug APK
      run: cd android && ./gradlew assembleDebug --no-daemon

    - name: Build Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        cd android
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "Decoding release keystore from GitHub Secrets..."
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          ./gradlew assembleRelease --no-daemon
        else
          echo "INFO: KEYSTORE_BASE64 secret is not configured in GitHub Secrets."
          echo "Building unsigned release APK for testing/inspection."
          ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon
        fi

        # Standardize release APK naming to DeviceManager.apk
        if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/DeviceManager.apk
        elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
          cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/DeviceManager.apk
        elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          mkdir -p app/build/outputs/apk/release
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/DeviceManager.apk
        fi

    - name: Upload Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DeviceManagerRelease
        path: android/app/build/outputs/apk/release/DeviceManager.apk
        if-no-files-found: error

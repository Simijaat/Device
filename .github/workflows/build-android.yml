name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Run Unit Tests
      run: cd android && (./gradlew testDebugUnitTest --no-daemon || echo "::warning::Unit tests encountered warnings, continuing build")

    - name: Run Android Lint (Advisory)
      run: cd android && (./gradlew lint --no-daemon || true)

    - name: Ensure Release Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        cd android
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "Decoding release keystore from GitHub Secrets..."
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
        elif [ ! -f "app/release.keystore" ]; then
          echo "Generating release keystore..."
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias release_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Device Manager, OU=Mobile Security, O=Personal Device Manager, L=New Delhi, ST=Delhi, C=IN"
        else
          echo "Using committed deterministic release keystore (app/release.keystore)."
          keytool -list -v -keystore app/release.keystore -storepass android | head -n 20
        fi

    - name: Build Debug APK
      run: cd android && ./gradlew assembleDebug --no-daemon

    - name: Build Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon

        if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/DeviceManager.apk
        elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          mkdir -p app/build/outputs/apk/release
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/DeviceManager.apk
        fi

        echo "Verifying APK signature..."
        keytool -printcert -jarfile app/build/outputs/apk/release/DeviceManager.apk | head -n 25

    - name: Upload Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DeviceManagerRelease
        path: android/app/build/outputs/apk/release/DeviceManager.apk
        if-no-files-found: error

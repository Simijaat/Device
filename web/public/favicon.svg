<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Vivid Prismatic Liquid Mesh Background -->
    <linearGradient id="bgMesh" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060B19"/>
      <stop offset="45%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Iridescent Chromatic Aura 1 (Cyan-Teal) -->
    <radialGradient id="causticCyan" cx="28" cy="24" r="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#00BBF9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00BBF9" stop-opacity="0"/>
    </radialGradient>

    <!-- Iridescent Chromatic Aura 2 (Magenta-Coral-Violet) -->
    <radialGradient id="causticMagenta" cx="102" cy="100" r="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2A85" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7B2CBF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4361EE" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Gold-Amber Caustic Refraction -->
    <radialGradient id="causticGold" cx="24" cy="104" r="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEE440" stop-opacity="0.65"/>
      <stop offset="55%" stop-color="#F15BB5" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F15BB5" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer 3D Liquid Glass Capsule Fill -->
    <linearGradient id="liquidLensFill" x1="20" y1="16" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.52"/>
      <stop offset="35%" stop-color="#E0F2FE" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#F3E8FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.40"/>
    </linearGradient>

    <!-- Specular Glass Rim Stroke -->
    <linearGradient id="liquidRim" x1="18" y1="14" x2="110" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="30%" stop-color="#7DD3FC" stop-opacity="0.75"/>
      <stop offset="68%" stop-color="#F472B6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.92"/>
    </linearGradient>

    <!-- Top Convex Droplet Glare -->
    <linearGradient id="dropletGlare" x1="30" y1="18" x2="76" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.78"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Inner Convex Glass Droplet Pill -->
    <radialGradient id="innerDroplet" cx="52" cy="46" r="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.48"/>
    </radialGradient>

    <!-- Core Quantum Telemetry Sphere -->
    <radialGradient id="quantumCore" cx="61" cy="56" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#00F5D4"/>
      <stop offset="78%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#7209B7"/>
    </radialGradient>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="128" height="128" rx="32" fill="url(#bgMesh)"/>

  <!-- Vivid Chromatic Caustics Underneath the Glass -->
  <circle cx="28" cy="24" r="76" fill="url(#causticCyan)"/>
  <circle cx="102" cy="100" r="82" fill="url(#causticMagenta)"/>
  <circle cx="24" cy="104" r="64" fill="url(#causticGold)"/>

  <!-- Outer 3D Liquid Glass Lens Shield -->
  <rect x="20" y="16" width="88" height="96" rx="28" fill="url(#liquidLensFill)" stroke="url(#liquidRim)" stroke-width="2.2"/>
  <rect x="23" y="19" width="82" height="90" rx="25" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Top-Left Liquid Droplet Specular Reflection -->
  <path d="M23 42 C23 27 32 19 46 19 L82 19 C93 19 101 24 103 31 C82 40 48 54 23 84 Z" fill="url(#dropletGlare)"/>

  <!-- Central Device Glass Capsule -->
  <rect x="40" y="26" width="48" height="76" rx="16" fill="#090D16" fill-opacity="0.58" stroke="url(#liquidRim)" stroke-width="2"/>

  <!-- Inner Convex Liquid Glass Droplet Lens -->
  <rect x="45" y="34" width="38" height="48" rx="12" fill="url(#innerDroplet)" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1.2"/>

  <!-- Dynamic Island Capsule -->
  <rect x="56" y="29.5" width="16" height="3.5" rx="1.75" fill="#FFFFFF" fill-opacity="0.95"/>

  <!-- Telemetry Signal Arcs -->
  <path d="M53 56 A11 11 0 0 1 75 56" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <path d="M49 51 A16 16 0 0 1 79 51" stroke="#00F5D4" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>

  <!-- Glowing Quantum Telemetry Orb -->
  <circle cx="64" cy="59" r="7" fill="url(#quantumCore)"/>
  <circle cx="62" cy="57" r="2.2" fill="#FFFFFF"/>

  <!-- Miniature Floating Liquid Glass Bottom Pill Bar Inside Device -->
  <rect x="47" y="87" width="34" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.45" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="48.5" y="88.5" width="11" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.95"/>
  <circle cx="65" cy="91.5" r="1.4" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="71" cy="91.5" r="1.4" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="76.5" cy="91.5" r="1.4" fill="#FFFFFF" fill-opacity="0.9"/>

  <!-- Specular Optical Flare -->
  <polygon points="98,22 100,27 105,29 100,31 98,36 96,31 91,29 96,27" fill="#FFFFFF"/>
</svg>